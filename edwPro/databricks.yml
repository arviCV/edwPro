# This is a Declarative Automation Bundle definition for edwPro.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: edwPro
  uuid: b4afaf03-4d71-4cc6-ba7e-5ca92d383713

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f7162bc1-8f6a.cloud.databricks.com
    variables:
      catalog: dbc-f7162bc1-8f6a
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-f7162bc1-8f6a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/arvind.androidace@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/arvind.androidace@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbc-f7162bc1-8f6a
      schema: prod
    permissions:
      - user_name: arvind.androidace@gmail.com
        level: CAN_MANAGE
