[project]
name = "edwPro"
version = "0.0.1"
authors = [{ name = "arvind.androidace@gmail.com" }]
requires-python = ">=3.12,<=3.13.5"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "numpy (>=2.5.3,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect",
    "ipykernel",
]

[project.scripts]
main = "edwPro.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
