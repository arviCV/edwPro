# The main pipeline for edwPro

resources:
  pipelines:
    edwPro_etl:
      name: edwPro_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/edwPro_etl"

      libraries:
        - glob:
            include: ../src/edwPro_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
